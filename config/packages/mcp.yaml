mcp:
    servers:
        default:
            name: 'repcoach'
            registry: ['App\Session\Mcp\', 'App\Workout\Mcp\', 'App\Exercise\Mcp\']

            session:
                store: file
                directory: '%kernel.project_dir%/var/mcp-sessions'

            transports:
                stdio: true
                http: false

            http:
                path: /mcp

when@test:
    mcp:
        servers:
            default:
                transports:
                    http: true
