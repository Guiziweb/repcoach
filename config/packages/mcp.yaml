mcp:
    servers:
        default:
            name: 'repcoach'
            registry: ['App\Session\Mcp\', 'App\Workout\Mcp\', 'App\Exercise\Mcp\']

            session:
                store: file
                directory: '%kernel.project_dir%/var/mcp-sessions'

            transports:
                stdio: true
                http: false

            http:
                path: /mcp

    clients:
        repcoach:
            servers:
                self:
                    transport: stdio
                    command: [!php/const PHP_BINARY, '%kernel.project_dir%/bin/console', 'mcp:server', '--env=%kernel.environment%']

when@test:
    mcp:
        servers:
            default:
                transports:
                    http: true
