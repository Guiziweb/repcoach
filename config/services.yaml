imports:
    - { resource: ../fixtures/workouts.yaml }

parameters:
    app.repdb_url: 'https://raw.githubusercontent.com/RepDB/exercise-dataset/free-701-2026-11/exercises.json'
    app.sessions.per_page: 10
    app.coach.tool_prefix: 'repcoach_'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Exercise/Enum/'
            - '../src/Exercise/Exercise.php'
            - '../src/Exercise/Import/{DatasetUnavailable,InvalidExerciseRow}.php'
            - '../src/Exercise/Mcp/ExerciseSummary.php'
            - '../src/Session/{ClosedStatus,PerformedSet,SessionExercise,SessionNotRunning,SessionStatus,SessionTally,SessionTransition,WorkoutSession}.php'
            - '../src/Session/Mcp/{PerformedSetView,SessionOverview,SessionPlanView,SessionSummary}.php'
            - '../src/Workout/{Workout,WorkoutExercise,WorkoutName}.php'
            - '../src/Workout/Mcp/{PlannedExerciseView,WorkoutSummary}.php'
            - '../src/Shared/{Effort,ExerciseEffort,PlannedEffort,Limits,Minutes,NotFound,Reason,Refused}.php'
            - '../src/Web/Coach/{CoachRequest,Consumption,Reply}.php'
            - '../src/Web/Program/View/'
            - '../src/Web/Session/View/'

when@test:
    services:
        App\Tests\Web\Coach\ScriptedCoach:
            public: true

        app.test.coach_platform:
            class: Symfony\AI\Platform\Platform
            decorates: ai.platform.anthropic
            factory: ['@App\Tests\Web\Coach\ScriptedCoach', 'platform']
            arguments: ['@event_dispatcher']
