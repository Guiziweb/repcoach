    slow: Easy, give me a minute to catch my breath.
    placeholder: Talk to me…
    send: Send
    confirm: 'Confirm: {action}'
    confirmed: I pressed the button.
    expired: That request is no longer valid. Tell me again what you want to do.
    full: We have talked a lot, my memory is full. Press ↺ to start a fresh conversation.
    resting: "I have coached a lot today, I need to rest. Come back tomorrow!"
